const ic = (n, c="i") => `<svg class="${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
const ROL = {operator:["#0052FF","msg"],sotuv:["#10B981","up"],targetolog:["#F43F5E","tgt"],kontentchi:["#8B5CF6","pen"],direktor:["#0F172A","cmp"],moliya:["#F59E0B","wal"],operatsiya:["#06B6D4","pkg"],hr:["#6366F1","usr"],sifat:["#14B8A6","star"],kotib:["#0EA5E9","cal"]};
const BOL = {mar:["#F43F5E","meg"],sot:["#10B981","up"],mij:["#0052FF","msg"],ops:["#06B6D4","pkg"],mol:["#F59E0B","wal"],hr:["#6366F1","usr"],rah:["#0F172A","crown"]};
const rr = a => ROL[a.rol] || ["#64748B","spk"];
const ap = (rang, n) => `<span class="ap" style="--c:${rang}">${ic(n)}</span>`;
const avA = a => ap(rr(a)[0], rr(a)[1]);
const DAR = [["L0","Odamda qoladi"],["L1","Yordamchi"],["L2","Tasdiq bilan"],["L3","Avtomat + nazorat"],["L4","To'liq avtomat"]];
const LC = i => `var(--L${i})`;
// Yo'riqnoma — hisob.py dagi yoriqnoma() bilan bir xil matn
const yor = a => `Sen — ${D.nomi}ning AI xodimisan. Roling: ${a.nom}. Soha: ${D.soha.toLowerCase()}${D.mahsulot?", asosiy mahsulot: "+D.mahsulot:""}.

MAQSAD: ${a.maqsad}.
O'LCHOV: ${a.metrika}.

JAVOBGARLIGING:
${a.ishlar.map(x=>"- "+x.n).join("\n")}

ISHDAN OLDIN O'QIYSAN (xotira): ${a.xotira.join("; ")}.
Hujjatda yo'q faktni (narx, muddat, va'da) o'ylab topma — «aniqlab beraman» de va rahbarga savol qoldir.

OHANG: o'zbek tilida, «siz»da, qisqa va xushmuomala; mijoz rus tilida yozsa — rus tilida. Xushomad va ortiqcha emoji yo'q.

HUQUQLARING:
- Erkin: ${a.huquq.erkin.join("; ")}
- Tasdiq bilan (avval rahbarga ko'rsatasan): ${a.huquq.tugma.join("; ")||"—"}
- Yopiq (hech qachon): ${a.huquq.yopiq.join("; ")}

ESKALATSIYA: ${a.eskalatsiya} → darhol rahbarga xabar; mijozga «mutaxassis javob beradi» deysan.

HISOBOT: ${a.ritm}. Format: nima qildim · raqamlar · muammo · sizdan nima kerak.`;
const e = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const Lb = L => `<span class="L" style="--lc:${LC(L)}">${DAR[L][0]} · ${e(DAR[L][1])}</span>`;
const leg = () => `<div class="leg">${DAR.map((d,i)=>`<span class="lt" style="--lc:${LC(i)}"><i></i>${d[0]} ${e(d[1])}</span>`).join("")}</div>`;
const kalit = "hiworld-jamoa:" + (D.biznes||"") + ":" + D.soni;
let holat = {}; try { holat = JSON.parse(localStorage.getItem(kalit)) || {}; } catch(_) {}
let tab = "umumiy";

function umumiy(){
  const jL = [0,1,2,3,4].map(i=>D.bolimlar.reduce((s,b)=>s+b.L[i],0)), jj = Math.max(1, jL.reduce((s,v)=>s+v,0));
  const r = 2*Math.PI*26, ind = Math.max(0, Math.min(100, D.indeks)), rc = ind>=70?"var(--L3)":ind>=45?"var(--L2)":"var(--a)";
  const GI = [["zap","var(--L3)"],["uok","var(--L2)"],["lock","#64748B"]];
  return `<div class="hero"><div><div class="lb">Haftasiga bo'shaydigan vaqt</div><div class="big">${D.soat} <span>soat</span></div>
    <p>Bo'limlaringizdagi vaqtning ${D.foiz}% ini AI xodimlar oladi.</p>
    <div class="hb">${jL.map((v,i)=>i&&v?`<i style="width:${100*v/jj}%;opacity:${.35+.16*i}"></i>`:"").join("")}</div></div>
    <div class="hm"><div><b>${D.som} mln</b><span>so'm/oy qiymati</span></div><div><b>${D.agentlar.length}</b><span>AI xodim</span></div>
    <div><b>${D.L4}</b><span>ish to'liq avtomatga</span></div><div><b>${D.reja.length}</b><span>bosqich · 3 oy</span></div></div></div>
  <div class="g2 mt"><div class="k ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#E5E5EA" stroke-width="7"/><circle cx="32" cy="32" r="26" fill="none" stroke="${rc}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${r*ind/100} ${r}"/></svg>
    <div><div class="n" style="font-size:26px;font-weight:800">${ind}<span style="font-size:15px;color:var(--t3)">/100</span></div><b style="font-family:var(--fh)">Tayyorlik indeksi</b><div class="iz" style="margin:0">${ind>=70?"Poydevor yaxshi — tez boshlash mumkin.":ind>=45?"0-haftani o'tkazib yubormang.":"Avval poydevor: hujjatlar va jadvallar."}</div></div></div>
    <div class="k izb">${ap("var(--a)","spk")}<div>${D.umumiy_izoh?e(D.umumiy_izoh):`${D.soni} ta ish baholandi. Hisob — qoidaga asoslangan taxmin (±25%).${D.yangi?` Bundan tashqari hozir qilinmayotgan ~${D.yangi} soatlik ishni ham AI oladi.`:""}`}</div></div></div>
  <div class="sh"><span>Bo'limlar</span><span>AI ulushi</span></div>
  <div class="k">${D.bolimlar.map(b=>{ const j = Math.max(1, b.L.reduce((s,v)=>s+v,0)), bi = BOL[b.k] || ["#64748B","lay"];
    return `<div class="r">${ap(bi[0],bi[1])}<div class="m"><b>${e(b.n)}</b><small>~${b.jami} soat/hafta</small>
      <div class="bar">${b.L.map((v,i)=>v?`<i style="width:${100*v/j}%;background:${LC(i)}"></i>`:"").join("")}</div></div><div class="v">${b.foiz}%</div></div>`; }).join("")}</div>
  ${leg()}
  <div class="g3">${D.guruhlar.map(([n,L,xs],k)=>`<div><div class="sh"><span>${e(n)}</span><span>${xs.length}</span></div><div class="k">
    ${xs.map(x=>`<div class="r">${ap(GI[k][1],GI[k][0])}<div class="m"><b style="font-size:14.5px">${e(x.n)}</b><small>${e(x.s)}</small></div></div>`).join("")||`<div class="r np"><div class="m"><small>Bunday ish yo'q</small></div></div>`}</div></div>`).join("")}</div>`;
}

const chkR = (k, t) => `<div class="r np${holat[k]?" on":""}" data-k="${k}"><span class="bx">${ic("ok")}</span><div class="m">${e(t)}</div></div>`;

function agentKarta(a, i){
  const n = a.tartib.length, rang = rr(a)[0];
  const qadam = a.tartib.map((t,k)=>{ const siz = k>0 && k<n-1 && /siz(ga|ning)? |tasdiq|tugma/i.test(t);
    return `<div class="fs${siz?" siz":""}"><span class="no">${k===0?ic("inb"):k===n-1?ic("flag"):siz?ic("me"):k+1}</span><span>${e(t)}${siz?` <span class="ch2">siz</span>`:""}</span></div>`; }).join("");
  return `<details ${i===0?"open":""}>
  <summary>${avA(a)}<div class="an">${e(a.nom)}<small>${a.ishlar.length} ta ish · ${e(a.yol.nom)} · ${e(a.yol.muddat)}</small></div>
  <div class="af">${a.soat?`<b>~${a.soat} soat</b>haftasiga · ~${a.som} mln/oy`:a.yangi?`<b>+${a.yangi} soat</b>yangi ish`:`<b>Nazorat</b>jamoani kuzatadi`}</div>${ic("rt","i ch")}</summary>
  <div class="ai">
    <div class="arg"><b>Nega aynan shu.</b> ${e(a.argument)}${a.izoh?`<br><br><b>Sizning biznesingiz uchun.</b> ${e(a.izoh)}`:""}</div>
    <div><div class="sl">${ic("rep")}Qanday ishlaydi</div><div class="fl" style="--lc:${rang}">${qadam}</div>
      <div class="ritm">${ic("cal")}<div><b>Ritm:</b> ${e(a.ritm)}</div></div></div>
    <div><div class="sl">${ic("lay")}Oladigan ishlari</div><div class="in">${a.ishlar.map(x=>`<div class="r np"><div class="m" style="font-size:14px">${e(x.n)}</div>${Lb(x.L)}</div>`).join("")}</div></div>
    <div><div class="sl">${ic("shd")}Nazorat</div><div class="nz">
      <div><b>${ap("var(--L3)","open")}Erkin</b>${e(a.huquq.erkin.join("; "))}</div>
      <div><b>${ap("var(--L2)","uok")}Siz tasdiqlaysiz</b>${e(a.huquq.tugma.join("; ")||"—")}</div>
      <div><b>${ap("#0F172A","lock")}Hech qachon</b>${e(a.huquq.yopiq.join("; "))}</div></div></div>
    <div><div class="sl">${ic("me")}Sizdan kerak</div><div class="in chk">${a.sizdan.map((t,k)=>chkR(a.rol+":"+k,t)).join("")}</div></div>
    <div><div class="sl">${ic("plug")}Vositalar va qurish</div><div class="in">${a.vositalar.map(v=>`<div class="r">${ap("#64748B","plug")}<div class="m"><b style="font-size:14px">${e(v[0])}</b><small>${e(v[1])}</small></div></div>`).join("")||`<div class="r">${ap("#64748B","doc")}<div class="m"><small>Maxsus ulanish shart emas — hujjatlar bilan ishlaydi</small></div></div>`}
      <div class="r">${ap("var(--a)","spk")}<div class="m"><b style="font-size:14px">${e(a.yol.daraja)} · ${e(a.yol.nom)} (${e(a.yol.muddat)})</b><small>${e(a.yol.qanday)}</small></div></div></div></div>
    <div><div class="yq"><div class="sl">${ic("doc")}Yo'riqnoma (miya)</div><button class="bt" data-nusxa="${i}">${ic("cp")}<span>Nusxa olish</span></button></div><pre id="y${i}">${e(yor(a))}</pre></div>
  </div></details>`;
}

function jamoaT(){
  const dir = D.agentlar.find(a=>a.rol==="direktor"), qol = D.agentlar.filter(a=>a.rol!=="direktor");
  return `<p class="iz">Har AI xodimda besh qism bor: yo'riqnoma, xotira (hujjatlar), vositalar (ulanishlar), ritm (jadval) va nazorat.</p>
  <div class="k org"><div class="on1 siz">${ap("var(--a)","me")}Siz — tasdiq va qaror</div><div class="vl"></div>
  ${dir?`<div class="on1 dir">${avA(dir)}${e(dir.nom)}</div><div class="vl"></div>`:""}
  <div class="bus">${qol.map((a,i)=>`<div class="${i<(qol.length-1)/2?"chap":""}" style="--i:${i}"><div class="ag">${avA(a)}<div>${e(a.nom)}<small>${a.soat?`~${a.soat} soat/hafta`:a.yangi?`+${a.yangi} soat yangi ish`:""}</small></div></div></div>`).join("")}</div>
  <div class="vl"></div><div class="odam">Odam xodimlar — vaqti muhimroq ishga bo'shaydi</div></div>
  <div class="sh"><span>Har agent qanday ishlaydi</span></div>
  ${D.agentlar.map(agentKarta).join("")}
  ${D.keyin.length?`<p class="sf">Keyingi bosqich (hozircha vaqti kam): ${e(D.keyin.join(", "))}.</p>`:""}`;
}

function rejaT(){
  const R = D.reja, oxir = R.length-1, SI = ["doc","spk","plug","rep"];
  const bosh = a => { for (let s=1; s<R.length; s++) { if (R[s].sar.includes(a.nom) || R[s].ishlar.some(x=>x.includes(a.nom))) return s; } return oxir; };
  const qator = a => { const s0 = bosh(a), mx = Math.max(1, ...a.ishlar.map(x=>x.L));
    return `<div class="nm">${avA(a)}${e(a.nom)}</div>` + R.map((r,s)=>{ if (s<s0) return `<div class="c"></div>`;
      const L = s===s0 ? 1 : s===s0+1 ? Math.min(2,mx) : mx, mq = s===oxir && s>s0;
      return `<div class="c"><div class="sg${s===s0?" s":""}${s===oxir?" e":""}${mq?" mq":""}" style="--lc:${LC(L)}">${DAR[L][0]} ${mq?"maqsad":e(DAR[L][1])}</div></div>`; }).join(""); };
  return `<p class="iz">Avval tez natija va past xavf: bitta agent, qoralama rejimi. Keyin ulanish va tasdiq tugmasi. Oxirida avtomat va ritm.</p>
  <div class="k st4">${R.map((r,s)=>`<div>${ap("var(--a)",SI[s]||"flag")}<b>${e(r.vaqt)}</b><span>${e(r.vaqt==="1-hafta"?"Birinchi agent":r.sar)}</span></div>`).join("")}</div>
  <div class="sh"><span>Agentlar darajasi bosqichma-bosqich</span></div>
  <div class="k gn"><div class="gt"><div class="h" style="padding-left:16px">Agent</div>${R.map(r=>`<div class="h">${e(r.vaqt)}</div>`).join("")}${D.agentlar.map(qator).join("")}</div></div>
  ${leg()}
  <div class="sh"><span>Bosqichlar</span></div>
  <div class="tl">${R.map((r,s)=>`<div class="k sn">${ap("var(--a)",SI[s]||"flag")}<div><div class="kc">${e(r.vaqt)}</div><h3>${e(r.sar)}</h3>
    <ul>${r.ishlar.map(x=>`<li>${e(x)}</li>`).join("")}</ul><div class="mz">${ic("flag")}Keyingisiga o'tish: ${e(r.mezon)}</div></div></div>`).join("")}</div>
  <div class="sh"><span>Qoida va xavflar</span></div>
  <div class="k"><div class="r">${ap("var(--L3)","shd")}<div class="m"><b>Stajirovka</b><small>Agent keyingi darajaga 2 hafta yoki 50 ta ishda jiddiy xatosiz bo'lsa o'tadi; xato qilsa — bir daraja pastga.</small></div></div>
  ${D.xavflar.map(x=>`<div class="r">${ap("var(--L2)","warn")}<div class="m"><b>${e(x[0])}</b><small>${e(x[1])}</small></div></div>`).join("")}</div>`;
}

function sizdanT(){
  const hamma = D.sizdan_umumiy.map((t,k)=>"umumiy:"+k).concat(D.agentlar.flatMap(a=>a.sizdan.map((t,k)=>a.rol+":"+k)));
  const bor = hamma.filter(k=>holat[k]).length;
  const blok = (nom, rol, xs) => `<div class="sh"><span>${e(nom)}</span><span>${xs.filter((t,k)=>holat[rol+":"+k]).length}/${xs.length}</span></div><div class="k chk">${xs.map((t,k)=>chkR(rol+":"+k,t)).join("")}</div>`;
  return `<p class="iz">Agentlar ishlashi uchun sizdan kerak bo'ladigan narsalar. Tayyorlaganingizni belgilang.</p>
  <div class="k" style="padding:16px"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Tayyorgarlik</h3><span class="n" style="font-weight:800;font-size:20px">${bor} / ${hamma.length}</span></div><div class="pr"><i style="width:${hamma.length?100*bor/hamma.length:0}%"></i></div></div>
  ${blok("Hamma agentlar uchun", "umumiy", D.sizdan_umumiy)}${D.agentlar.map(a=>blok(a.nom, a.rol, a.sizdan)).join("")}`;
}

const TABLAR = [["umumiy","Umumiy",umumiy],["jamoa","Jamoa",jamoaT],["reja","Yo'l xaritasi",rejaT],["sizdan","Sizdan",sizdanT]];

}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-tab]"); if (t) { tab = t.dataset.tab; chiz(); window.scrollTo(0,0); return; }
  const l = ev.target.closest("[data-k]");
  if (l) { holat[l.dataset.k] = !holat[l.dataset.k]; try { localStorage.setItem(kalit, JSON.stringify(holat)); } catch(_) {} chiz(); return; }
  const b = ev.target.closest("[data-nusxa]");
  if (b) {
    const s = b.querySelector("span"), pre = document.getElementById("y"+b.dataset.nusxa);
    const ok = () => { s.textContent = "Nusxa olindi"; setTimeout(()=>s.textContent="Nusxa olish",1500); };
    const qol = () => { const r = document.createRange(); r.selectNodeContents(pre); const g = getSelection(); g.removeAllRanges(); g.addRange(r); s.textContent = "Belgilandi — Ctrl/Cmd+C"; };
    try { navigator.clipboard.writeText(yor(D.agentlar[+b.dataset.nusxa])).then(ok, qol); } catch(_) { qol(); }
  }
});
chiz();
</script>
